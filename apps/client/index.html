<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="친구들과 별똥별 조각을 먼저 모으는 실시간 3D 웹게임"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23171326'/><path d='M32 8l5.4 16.6H55l-14.2 10.3 5.4 16.7L32 41.3 17.8 51.6l5.4-16.7L9 24.6h17.6z' fill='%23ffd37a'/></svg>"
    />
    <title>별빛 수집가</title>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="별빛 수집가 3D 게임 화면"></canvas>

    <main id="start-screen" class="start-screen">
      <section class="start-card" aria-labelledby="game-title">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-star">✦</span>
          <span class="brand-orbit"></span>
        </div>
        <p class="eyebrow">MULTIPLAYER STAR HUNT</p>
        <h1 id="game-title">별빛 수집가</h1>
        <p class="intro">
          밤하늘의 신호를 따라 달려가세요.<br />
          떨어진 조각은 가장 먼저 손을 뻗은 한 사람의 것.
        </p>

        <form id="join-form" novalidate>
          <label for="nickname">탐험가 이름</label>
          <div class="input-wrap">
            <input
              id="nickname"
              name="nickname"
              type="text"
              minlength="2"
              maxlength="12"
              placeholder="2~12자"
              autocomplete="nickname"
              spellcheck="false"
            />
            <span id="nickname-count" aria-hidden="true">0 / 12</span>
          </div>
          <p id="form-error" class="form-error" role="alert"></p>
          <button id="play-button" type="submit">
            <span>별빛 세계 입장</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="connection-row">
          <span id="connection-dot" class="status-dot"></span>
          <span id="connection-status">서버 연결 대기 중</span>
        </div>

        <div class="start-footer">
          <span><kbd>WASD</kbd> 이동</span>
          <span><kbd>Shift</kbd> 달리기</span>
          <span><kbd>E</kbd> 수집</span>
        </div>
      </section>
      <p class="start-tip">별똥별은 45~90초 사이에 나타나요</p>
    </main>

    <section id="game-ui" class="game-ui is-hidden" aria-live="polite">
      <div class="hud-card player-card">
        <span class="hud-label">EXPLORER</span>
        <strong id="hud-nickname">—</strong>
        <div class="score-row">
          <span class="score-gem" aria-hidden="true">◆</span>
          <span id="hud-score">0</span>
          <span class="score-unit">조각</span>
        </div>
      </div>

      <div class="hud-card room-card">
        <div class="room-stat">
          <span class="hud-label">ROOM</span>
          <strong><span id="hud-players">1</span> / 8</strong>
        </div>
        <div class="room-divider"></div>
        <div class="room-stat timer-stat">
          <span class="hud-label">NEXT STAR</span>
          <strong id="hud-timer">—</strong>
        </div>
      </div>

      <div id="event-banner" class="event-banner is-hidden">
        <span class="event-icon">✦</span>
        <div>
          <span class="event-kicker">SKY SIGNAL</span>
          <strong id="event-message">별똥별이 나타났습니다</strong>
        </div>
      </div>

      <div id="collect-prompt" class="collect-prompt is-hidden">
        <kbd>E</kbd>
        <div>
          <span>별 조각</span>
          <strong>수집하기</strong>
        </div>
      </div>

      <div id="notice" class="notice is-hidden"></div>

      <div class="control-hint">
        <span><kbd>WASD</kbd> 이동</span>
        <span><kbd>Shift</kbd> 달리기</span>
        <span><span class="mouse-icon">◉</span> 우클릭 회전 · 휠 줌</span>
      </div>
    </section>

    <div id="fatal-error" class="fatal-error is-hidden" role="alert">
      <strong>연결이 끊어졌습니다</strong>
      <span id="fatal-error-message">서버를 확인한 뒤 새로고침해 주세요.</span>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
